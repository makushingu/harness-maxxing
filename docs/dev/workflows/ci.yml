name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Tests never touch the real system (see CLAUDE.md): a throw-away state, no real spawn, no real crontab.
      # Telegram and GitHub are mocked by the tests themselves (MAXXING_TELEGRAM_API / MAXXING_GITHUB_API).
      MAXXING_STATE: /tmp/mx-ci-state
      MAXXING_SPAWN: direct
      MAXXING_CRONTAB_FILE: /tmp/mx-ci-crontab
      MAXXING_LICENSE_PING: "0"
      MAXXING_SYSTEM_TZ: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Install dependencies
        working-directory: server
        run: uv sync
      - name: Run tests
        working-directory: server
        run: uv run pytest -q

  web:
    name: Web typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  pc-agent:
    name: PC agent tests (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pc-agent/go.mod
          cache-dependency-path: pc-agent/go.sum
      - name: Test
        working-directory: pc-agent
        run: go test ./...
