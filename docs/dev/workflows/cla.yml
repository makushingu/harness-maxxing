name: CLA

# CLA Assistant Lite: a contributor signs CLA.md once by commenting on a pull request; signatures are stored in
# signatures/cla.json on the branch `cla-signatures` (created by the action on the first signature).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write          # write the signatures file on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: rorogeno,FEUAZUR,bot*,dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [Harness Maxxing Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting the comment below (contributing for a company? see "How to sign" in CLA.md).
