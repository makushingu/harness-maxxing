# Checks of CONTRIBUTING.md step 3 on every pull request and every push to main: server tests, web typecheck and
# build, pc-agent tests. Actions are pinned by commit SHA. No secret is used; pull requests from forks run with a
# read-only token.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ffmpeg (thumbnail tests)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        working-directory: server
        run: uv sync --locked
      - name: Test
        working-directory: server
        run: uv run pytest -q -p no:cacheprovider
  web:
    name: Web typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
  pc-agent:
    name: PC agent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pc-agent/go.mod
          cache-dependency-path: pc-agent/go.sum
      - name: Test
        working-directory: pc-agent
        run: go test ./...
